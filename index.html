<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سلطانوس | Sultanus</title>
<meta name="description" content="رحلات سلطانوس الجبلية الفاخرة في عُمان | Sultanus luxury mountain trips and camping in Oman">
<script>try{var l=localStorage.getItem("lang")||((navigator.language||"").toLowerCase().indexOf("ar")===0?"ar":"en");document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6F4; --card:#FFFFFF; --ink:#14202E; --muted:#5B6674; --line:#DEE2E6;
  --brand:#B25B00; --brand-ink:#FFFFFF; --gold:#B8892B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0B1220;--card:#131C2E;--ink:#EEF2F7;--muted:#9FB0C3;--line:#25344A;--brand:#F5A623;--brand-ink:#1A1000;--gold:#F5A623;}
}
:root[data-theme="dark"]{--bg:#0B1220;--card:#131C2E;--ink:#EEF2F7;--muted:#9FB0C3;--line:#25344A;--brand:#F5A623;--brand-ink:#1A1000;--gold:#F5A623;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.8;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:32px 20px 48px}
h1{font-size:1.75rem;line-height:1.5;margin:0 0 12px;font-weight:700}
.who{color:var(--muted);margin:0 0 28px}
.price{display:flex;align-items:baseline;gap:8px;border-block:1px solid var(--line);padding:18px 0;margin-bottom:24px}
.price b{font-size:3rem;line-height:1;color:var(--brand);font-weight:700}
.price span{font-size:1.1rem;color:var(--muted)}
.price small{margin-inline-start:auto;color:var(--gold);font-weight:500}
h2{font-size:1.05rem;margin:0 0 10px}
ul{list-style:none;padding:0;margin:0 0 28px}
li{padding:8px 0;padding-inline-start:28px;position:relative}
li::before{content:"";position:absolute;inset-inline-start:0;top:16px;width:14px;height:8px;border-inline-start:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg)}
ol{margin:0 0 28px;padding-inline-start:22px}
ol li{padding:4px 0;padding-inline-start:6px}
ol li::before{display:none}
.pay{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);font:700 1.1rem/1 inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.pay:hover{filter:brightness(1.08)}
.pay:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.note{font-size:.88rem;color:var(--muted);text-align:center;margin:14px 0 0}
#msg{display:none;margin-top:14px;padding:12px 14px;border:1px solid var(--gold);border-radius:8px;font-size:.92rem}
.hero{margin:0 0 24px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card)}.hero img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:center top}
.opts{display:grid;gap:12px;margin:0 0 24px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.opt:has(input:checked){border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.opt:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:2px}
.opt input{accent-color:var(--brand);width:20px;height:20px;margin:0;flex:none}
.oi{flex:1;display:flex;flex-direction:column;line-height:1.5}
.oi b{font-size:1.05rem}.oi em{font-style:normal;color:var(--muted);font-size:.9rem}
.op{white-space:nowrap;color:var(--muted)}.op b{font-size:1.8rem;color:var(--brand);line-height:1}
.plan{display:none}.plan.on{display:block}
.paybox{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:20px 16px;text-align:center;margin:0 0 28px}
.amt{margin:0 0 14px;font-size:1.1rem}.amt b{font-size:1.9rem;color:var(--brand)}
.qr{display:block;margin:0 auto 14px;width:220px;max-width:70%;height:auto;background:#fff;padding:0;border-radius:10px}
.paybox p{margin:0 0 10px;color:var(--muted);font-size:.95rem}
.num{display:flex;align-items:center;justify-content:center;gap:12px}
.num b{font-size:1.5rem;letter-spacing:.06em;color:var(--ink)}
.num button{font:500 .9rem inherit;font-family:inherit;padding:8px 14px;border-radius:8px;border:1.5px solid var(--brand);background:transparent;color:var(--brand);cursor:pointer}
.num button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.days{margin:0 0 18px;padding:10px 14px;border-inline-start:3px solid var(--gold);background:var(--card);border-radius:8px;font-size:.95rem}
.closed{margin:0 0 24px;padding:16px;border:1.5px solid var(--gold);border-radius:12px;background:var(--card)}
.closed b{display:block;margin-bottom:6px}
.fld{display:block;margin:0 0 14px}
.fld span{display:block;margin-bottom:4px;font-size:.92rem;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:400 16px/1.6 inherit;font-family:inherit}
.fld textarea{min-height:130px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:3px solid var(--gold);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:#B3261E;font-size:.92rem;margin:10px 0 0}
:root[data-theme="dark"] .err{color:#F2B8B5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#F2B8B5}}
.ok{padding:18px;border:1.5px solid var(--brand);border-radius:12px;background:var(--card);text-align:center}
.ok b{display:block;font-size:1.15rem;margin-bottom:6px;color:var(--brand)}
.step{margin:0 0 28px}
.hp{position:absolute;left:-9999px;opacity:0;height:0}
.hero img{aspect-ratio:auto!important;object-fit:contain!important}
.rowtot{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 14px;color:var(--muted)}
.rowtot b{color:var(--brand);font-size:1.6rem}

.topbar{display:flex;justify-content:flex-end;margin:0 0 12px}
.lang{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 16px;font:500 .9rem inherit;font-family:inherit;cursor:pointer}
.lang:focus-visible,.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.seg{display:flex;gap:8px;margin:0 0 14px}
.seg button{flex:1;padding:10px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:500 .95rem inherit;font-family:inherit;cursor:pointer}
.seg button.on{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.bank{white-space:pre-wrap;text-align:start;direction:ltr;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;font:500 .88rem/1.7 ui-monospace,Menlo,Consolas,monospace;margin:0 0 12px;word-break:break-word;color:var(--ink)}
.pay.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.paybox .pay{margin-top:10px}
.usd{color:var(--muted);font-weight:400;font-size:.85rem;margin-inline-start:6px}
.hint{display:block;margin-top:4px;font-size:.8rem;color:var(--muted)}
li::before{content:"\2713"!important;border:0!important;transform:none!important;width:auto!important;height:auto!important;top:8px!important;color:var(--gold);font-weight:700}
</style>
</head>

      footer: "Your booking is confirmed once the payment is verified. Questions:",
      errPhone: "Invalid WhatsApp number. Enter an 8-digit Omani number, or an international number with country code.",

      errNoDates: "No dates are available right now. Please contact us on WhatsApp.",
      doneTitle: "Your booking request is received", doneRef: "Booking no.: {r}", doneStart: "Your trip starts: {d} ({n}, {p})",
      doneNote: "We will confirm after verifying your payment, by WhatsApp or email, and send you the meeting point and trip details.",
      waMsg: "Hello, I would like to pay from outside Oman for a trip booking: {n}, {p}, total {t} OMR (about ${u} USD).",
      n1: "1 night", n2: "2 nights", nN: "{n} nights", p1: "1 person", p2: "2 people", pN: "{n} people"
    }
  };

  var lang = "ar", cfg = { pricePerPerson: 100, maxNights: 3, maxPeople: 4, booked: [], today: null, horizon: 60 };
  var ref = null, payTab = "om", firstAvail = null;
  function $(id) { return document.getElementById(id); }
  function t(k, v) {
    var s = T[lang][k]; if (s == null) return k;
    if (v) for (var x in v) s = s.split("{" + x + "}").join(v[x]);
    return s;
  }
  function nTxt(n) { return n === 1 ? t("n1") : n === 2 ? t("n2") : t("nN", { n: n }); }
  function pTxt(n) { return n === 1 ? t("p1") : n === 2 ? t("p2") : t("pN", { n: n }); }
  function label(iso) { return new Date(iso + "T00:00:00Z").toLocaleDateString(lang === "ar" ? "ar" : "en-GB", { timeZone: "UTC", weekday: "long", day: "numeric", month: "long" }); }
  function addDays(iso, n) { return new Date(Date.parse(iso + "T00:00:00Z") + n * 864e5).toISOString().slice(0, 10); }
  function nights() { return +$("nights").value || 1; }
  function persons() { return +$("people").value || 1; }
  function totalOMR() { return nights() * persons() * cfg.pricePerPerson; }
  function usdTxt() { return "≈ $" + Math.round(totalOMR() * USD_PER_OMR).toLocaleString("en"); }

  function fillSelects() {
    var sel = $("nights"), ps = $("people"), kn = sel.value || "1", kp = ps.value || "1", i;
    sel.innerHTML = ""; ps.innerHTML = "";
    for (i = 1; i <= cfg.maxNights; i++) { var o = document.createElement("option"); o.value = i; o.textContent = nTxt(i); sel.appendChild(o); }
    for (i = 1; i <= cfg.maxPeople; i++) { var q = document.createElement("option"); q.value = i; q.textContent = pTxt(i); ps.appendChild(q); }
    sel.value = +kn <= cfg.maxNights ? kn : "1";
    ps.value = +kp <= cfg.maxPeople ? kp : "1";
  }
  function money() {
    var n = nights(), pe = persons(), total = totalOMR();
    $("perLine").textContent = t("perLine", { price: cfg.pricePerPerson });
    $("total").textContent = total; $("amt").textContent = total; $("amt2").textContent = total;
    $("usd").textContent = usdTxt(); $("usd2").textContent = usdTxt();
    $("calc").textContent = cfg.pricePerPerson + " × " + pTxt(pe) + " × " + nTxt(n);
    var msg = t("waMsg", { n: nTxt(n), p: pTxt(pe), t: total, u: Math.round(total * USD_PER_OMR) });
    $("inWa").href = "https://wa.me/" + WA + "?text=" + encodeURIComponent(msg);
  }
  function renderDays() {
    var d = $("days");
    if (!cfg.today) { d.textContent = t("daysDefault"); return; }
    d.textContent = firstAvail ? t("daysNext", { d: label(firstAvail) }) : t("daysNone");
  }
  function buildDates() {
    var sd = $("selDate"), keep = sd.value, n = nights();
    sd.innerHTML = ""; firstAvail = null;
    if (cfg.today) {
      for (var j = 1; j <= cfg.horizon; j++) {
        var d0 = addDays(cfg.today, j), free = true;
        for (var k = 0; k < n; k++) if (cfg.booked.indexOf(addDays(d0, k)) > -1) { free = false; break; }
        if (free) {
          var o = document.createElement("option"); o.value = d0;
          o.textContent = label(d0) + (n > 1 ? " (" + nTxt(n) + ")" : "");
          sd.appendChild(o); if (!firstAvail) firstAvail = d0;
        }
      }
      if (keep) sd.value = keep;
    }
    renderDays();
  }
  function renderPay() {
    $("payOm").hidden = payTab !== "om"; $("payIn").hidden = payTab !== "in";
    $("tabOm").className = payTab === "om" ? "on" : ""; $("tabIn").className = payTab === "in" ? "on" : "";
    $("tabOm").setAttribute("aria-pressed", payTab === "om"); $("tabIn").setAttribute("aria-pressed", payTab === "in");
    var link = $("inLink"), bank = $("inBank");
    link.hidden = !INTL_LINK; if (INTL_LINK) link.href = INTL_LINK;
    bank.hidden = !INTL_BANK; bank.textContent = INTL_BANK;
    $("inNone").hidden = !!(INTL_LINK || INTL_BANK);
  }
  function applyLang() {
    var h = document.documentElement; h.lang = lang; h.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    $("langBtn").textContent = lang === "ar" ? "English" : "العربية";
    fillSelects(); money(); buildDates(); renderPay();
    ["b1", "b2"].forEach(function (id) { if (!$(id).disabled) $(id).textContent = t(id === "b1" ? "sendProof" : "confirmBtn"); });
    $("copy").textContent = t("copy");
  }
  function setLang(l) { lang = l; try { localStorage.setItem("lang", l); } catch (e) {} applyLang(); }

  function loadCfg() {
    if (!SCRIPT_URL) return Promise.reject(new Error("no-url"));
    return fetch(SCRIPT_URL).then(function (r) { return r.json(); }).then(function (c) {
      for (var k in c) cfg[k] = c[k];
      fillSelects(); money(); buildDates();
    });
  }

  // ===== تشغيل / init =====
  try { lang = localStorage.getItem("lang") || ""; } catch (e) { lang = ""; }
  if (lang !== "ar" && lang !== "en") lang = (navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en";
  try { payTab = Intl.DateTimeFormat().resolvedOptions().timeZone === "Asia/Muscat" ? "om" : "in"; } catch (e) { payTab = "om"; }
  $("payPhone").textContent = PAY_PHONE;
  $("waLink").href = "https://wa.me/" + WA;
  $("days").textContent = "…";
  applyLang();
  loadCfg().catch(function () {});

  $("langBtn").addEventListener("click", function () { setLang(lang === "ar" ? "en" : "ar"); });
  $("tabOm").addEventListener("click", function () { payTab = "om"; renderPay(); });
  $("tabIn").addEventListener("click", function () { payTab = "in"; renderPay(); });
  $("nights").addEventListener("change", function () { money(); buildDates(); });
  $("people").addEventListener("change", money);
  $("copy").addEventListener("click", function () {
    var b = this;
    try { navigator.clipboard.writeText(PAY_PHONE); b.textContent = t("copied"); } catch (e) { b.textContent = PAY_PHONE; }
    setTimeout(function () { b.textContent = t("copy"); }, 2000);
  });

  function shrink(file) {
    return new Promise(function (res) {
      var img = new Image(), u = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { URL.revokeObjectURL(u); res(b); }, "image/jpeg", 0.82);
      };
      img.onerror = function () { res(null); };
      img.src = u;
    });
  }
  function toB64(blob) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(",")[1]); };
      r.onerror = rej; r.readAsDataURL(blob);
    });
  }
  function api(body) {
    if (!SCRIPT_URL) return Promise.reject(new Error("no-url"));
    return fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
      .then(function (r) { return r.text(); }, function () { throw new Error("net"); })
      .then(function (t) { try { return JSON.parse(t); } catch (e) { throw new Error("html"); } });
  }
  // يقبل الرقم العُماني بدون مفتاح الدولة أو معه، وأرقام الدول الأخرى مع رمز الدولة
  function normPhone(v) {
    var d = String(v || "").replace(/[٠-٩]/g, function (c) { return c.charCodeAt(0) - 1632; }).replace(/[^\d+]/g, "");
    d = d.replace(/^\+/, "").replace(/^00/, "");
    if (/^968\d{8}$/.test(d)) return d;
    if (/^\d{8}$/.test(d)) return "968" + d;
    if (/^\d{9,15}$/.test(d)) return d;
    return null;
  }
  function showErr(id, msg) { var e = $(id); e.textContent = msg; e.hidden = false; }
  function fail(id, btn, key, msg) { showErr(id, msg); btn.disabled = false; btn.textContent = t(key); }
  function srvErr(r) { return new Error((r.error || "x") + (r.detail ? ": " + r.detail : "")); }

  $("f1").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = this, b = $("b1"); $("e1").hidden = true;
    if (!f.checkValidity()) { f.reportValidity(); return; }
    var ph = normPhone(f.elements.Phone.value);
    if (!ph) { showErr("e1", t("errPhone")); return; }
    var file = $("proof").files[0], isPdf = file.type === "application/pdf";
    if (isPdf && file.size > 4 * 1024 * 1024) { showErr("e1", t("errBig")); return; }
    b.disabled = true; b.textContent = t("sending");
    (isPdf ? Promise.resolve(file) : shrink(file)).then(function (blob) {
      if (!blob) throw new Error("img");
      return toB64(blob);
    }).then(function (b64) {
      return api({ action: "proof", nights: nights(), people: persons(), name: f.elements.Name.value.trim(), phone: ph,
        email: f.elements.email.value.trim(), file: b64, mime: isPdf ? "application/pdf" : "image/jpeg", lang: lang });
    }).then(function (r) {
      if (!r.ok) throw srvErr(r);
      ref = r.ref;
      $("nights").disabled = true; $("people").disabled = true;
      $("step1").hidden = true; $("step2").hidden = false;
      $("step2").scrollIntoView({ behavior: "smooth" });
      return loadCfg().catch(function () {});
    }).catch(function (err) {
      fail("e1", b, "sendProof", err.message === "img" ? t("errImg") : t("errSend", { c: err.message }));
    });
  });

  $("f2").addEventListener("submit", function (e) {
    e.preventDefault();
    var b = $("b2"); $("e2").hidden = true;
    var date = $("selDate").value;
    if (!date) { fail("e2", b, "confirmBtn", t("errNoDates")); return; }
    b.disabled = true; b.textContent = t("sending");
    api({ action: "request", ref: ref, date: date, notes: $("msgText").value.trim(), lang: lang })
      .then(function (r) {
        if (!r.ok) throw srvErr(r);
        $("done").innerHTML = "<b>" + t("doneTitle") + "</b>" + t("doneRef", { r: ref }) + "<br>" +
          t("doneStart", { d: label(date), n: nTxt(nights()), p: pTxt(persons()) }) + "<br>" + t("doneNote");
        $("step2").hidden = true; $("done").hidden = false;
        $("done").scrollIntoView({ behavior: "smooth" });
      }).catch(function (err) {
        if (err.message === "taken") { fail("e2", b, "confirmBtn", t("errTaken")); loadCfg().catch(function () {}); }
        else fail("e2", b, "confirmBtn", t("errSend", { c: err.message }));
      });
  });
</script>
